<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>asesoria virtual</title>
    <link rel="stylesheet" href="asesoria_virtual.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css">
    <script src="asesoria_virtual.js" defer></script>
</head>
<body>
    <!------------------------------------->
    <!--|estructuracion_asesoria_virtual|-->
    <!------------------------------------->
    <main class="contenedor_asesoria_virtual">
        <!-- Encabezado informativo del formulario -->
        <header class="encabezado_asesoria_virtual">
            <div class="icono_asesoria_virtual">AV</div>
            <h1>Asesoría Virtual</h1>
            <p>Estamos aquí para ayudarte a resolver tus dudas.</p>
        </header>
        <!-- Formulario para solicitar una asesoría -->
        <form id="formulario_asesoria_virtual">
            <!-- Campo para ingresar el nombre completo -->
            <div class="grupo_asesoria_virtual">
                <label for="nombre_asesoria_virtual">Nombre completo</label>
                <input type="text" id="nombre_asesoria_virtual"
                    name="nombre" placeholder="Escribe tu nombre"
                    autocomplete="name" required>
            </div>
            <!-- Campo para ingresar el correo electrónico -->
            <div class="grupo_asesoria_virtual">
                <label for="correo_asesoria_virtual">Correo electrónico</label>
                <input type="email" id="correo_asesoria_virtual"
                    name="correo" placeholder="correo@ejemplo.com"
                    autocomplete="email" required>
            </div>
            <!-- Selector del tipo de asesoría -->
            <div class="grupo_asesoria_virtual">
                <label for="tipo_asesoria_virtual">Tipo de asesoría</label>
                <select id="tipo_asesoria_virtual"
                    name="tipo" required>
                    <option value="">Selecciona una opción</option>
                    <option value="Desarrollo web">Desarrollo web</option>
                    <option value="Informática">Informática</option>
                    <option value="Diseño digital">Diseño digital</option>
                    <option value="Consultoría general">Consultoría general</option>
                </select>
            </div>
            <!-- Campo para seleccionar la fecha -->
            <div class="grupo_asesoria_virtual">
                <label for="fecha_asesoria_virtual">Fecha de asesoría</label>
                <input type="date" id="fecha_asesoria_virtual"
                    name="fecha" required>
            </div>
            <!-- Selector del horario de atención -->
            <div class="grupo_asesoria_virtual">
                <label for="hora_asesoria_virtual">Horario preferido</label>
                <select id="hora_asesoria_virtual"
                    name="hora" required>
                    <option value="">Selecciona un horario</option>
                    <option value="09:00">09:00 a. m.</option>
                    <option value="11:00">11:00 a. m.</option>
                    <option value="14:00">02:00 p. m.</option>
                    <option value="16:00">04:00 p. m.</option>
                </select>
            </div>
            <!-- Campo para explicar el motivo de la consulta -->
            <div class="grupo_asesoria_virtual">
                <label for="motivo_asesoria_virtual">Motivo de la consulta</label>
                <textarea id="motivo_asesoria_virtual"
                    name="motivo" rows="4"
                    placeholder="Cuéntanos en qué podemos ayudarte..."
                    required></textarea>
            </div>
            <!-- Aviso sobre el guardado automático -->
            <p class="aviso_asesoria_virtual">
                Tus datos se guardan automáticamente en este navegador.
            </p>
            <!-- Botones de acciones del formulario -->
            <div class="acciones_asesoria_virtual">
                <button type="submit" id="boton_solicitar_asesoria">
                    Solicitar asesoría
                </button>
                <button type="button" id="boton_limpiar_asesoria">
                    Limpiar formulario
                </button>
            </div>
            <!-- Mensaje de respuesta para el usuario -->
            <p id="mensaje_asesoria_virtual"
                class="mensaje_asesoria_virtual"
                role="status" aria-live="polite"></p>
        </form>
    </main>
</body>
</html>
